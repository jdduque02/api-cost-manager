# Autenticación contra SonarQube vía token: expórtalo como SONAR_TOKEN
# (y SONAR_HOST_URL si difiere de sonar.host.url) antes de ejecutar sonar-scanner.
sonar.projectKey=financial-app
sonar.projectName=Financial App NestJS
sonar.sources=src
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/dto/**,**/entities/**,**/*.module.ts,**/main.ts,**/interfaces/**
sonar.host.url=http://localhost:9000

# Quality Gate: cobertura mínima global 80%
sonar.qualitygate.wait=true
sonar.coverage.minimum=80